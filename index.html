<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Photo Diner</title>
  <style>
    :root { --fg: #1c1c1c; --panel: rgba(255, 255, 255, 0.82); --accent: #c9a231; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --fg: #f1f1ef; --panel: rgba(28, 28, 30, 0.8); }
    }
    :root[data-theme="dark"] { --fg: #f1f1ef; --panel: rgba(28, 28, 30, 0.8); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #d9d6cf; font: 14px/1.4 system-ui, sans-serif; }
    #app canvas { display: block; touch-action: none; }
    .hud { position: fixed; left: 16px; top: 16px; right: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; pointer-events: none; }
    .hud > * { pointer-events: auto; }
    .card { background: var(--panel); color: var(--fg); backdrop-filter: blur(8px); border-radius: 10px; padding: 8px 12px; max-width: 340px; }
    .card b { color: var(--accent); }
    button { font: inherit; border: 0; border-radius: 10px; padding: 8px 12px; background: var(--panel); color: var(--fg); backdrop-filter: blur(8px); cursor: pointer; }
    button:hover { outline: 2px solid var(--accent); }
    .views { display: flex; gap: 6px; flex-wrap: wrap; }
    .help-touch { display: none; }
    @media (pointer: coarse) { .help-mouse { display: none; } .help-touch { display: inline; } }
    body[data-mode="orbit"] .walk-only { display: none; }
    body[data-mode="walk"] .orbit-only { display: none; }
    #stick { position: fixed; width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); background: rgba(0,0,0,.15); display: none; pointer-events: none; }
    #stick.on { display: block; }
    #stick .knob { position: absolute; left: 30px; top: 30px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.85); }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body data-mode="walk">
  <div id="app"></div>
  <div class="hud">
    <div class="card">
      <span class="walk-only">
        <span class="help-mouse"><b>WASD</b> move · <b>drag</b> look · double-click locks mouse · Shift run</span>
        <span class="help-touch"><b>Left thumb</b> move · <b>right thumb</b> look</span>
      </span>
      <span class="orbit-only">Drag to orbit · scroll/pinch to zoom · right-drag to pan</span>
    </div>
    <button id="mode">Inspect (orbit)</button>
    <span class="views orbit-only">
      <button data-view="room">Whole room</button>
      <button data-view="bar">Bar</button>
      <button data-view="booth">Booths</button>
      <button data-view="tables">Tables</button>
      <button data-view="neon">Neon sign</button>
      <button data-view="entrance">Entrance</button>
    </span>
    <button id="export" title="Download the stool and counter as .glb models">Download models</button>
  </div>
  <div id="stick"><div class="knob"></div></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
