<title>Photo Bar Room</title>
  <style>
    :root { --fg: #1c1c1c; --panel: rgba(255, 255, 255, 0.82); --accent: #c9a231; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --fg: #f1f1ef; --panel: rgba(28, 28, 30, 0.8); }
    }
    :root[data-theme="dark"] { --fg: #f1f1ef; --panel: rgba(28, 28, 30, 0.8); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #d9d6cf; font: 14px/1.4 system-ui, sans-serif; }
    #app canvas { display: block; touch-action: none; }
    .hud { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; pointer-events: none; }
    .hud > * { pointer-events: auto; }
    .card { background: var(--panel); color: var(--fg); backdrop-filter: blur(8px); border-radius: 10px; padding: 8px 12px; max-width: 340px; }
    .card b { color: var(--accent); }
    button { font: inherit; border: 0; border-radius: 10px; padding: 8px 12px; background: var(--panel); color: var(--fg); backdrop-filter: blur(8px); cursor: pointer; }
    button:hover { outline: 2px solid var(--accent); }
    .views { display: flex; gap: 6px; flex-wrap: wrap; }
    .help-touch { display: none; }
    @media (pointer: coarse) { .help-mouse { display: none; } .help-touch { display: inline; } }
    body[data-mode="orbit"] .walk-only { display: none; }
    body[data-mode="walk"] .orbit-only { display: none; }
    #use { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font-weight: 600; padding: 12px 18px; }
    #stick { position: fixed; width: 100px; height: 100px; margin: -50px 0 0 -50px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); background: rgba(0,0,0,.15); display: none; pointer-events: none; }
    #stick.on { display: block; }
    #stick .knob { position: absolute; left: 30px; top: 30px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.85); }
  </style>

<div id="loader"><div class="box"><div class="title">Photo Town</div><div class="bar"><i></i></div><div class="status">Building the world…</div><div class="hint">Loading every texture first so the world runs smoothly. This can take a minute on a slow connection.</div></div></div>
<style>
#loader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #0f1114; color: #e8e6e0; font: 15px/1.4 system-ui, sans-serif; transition: opacity .6s; }
#loader.done { opacity: 0; pointer-events: none; }
#loader .box { width: min(360px, 86vw); text-align: center; }
#loader .title { font-size: 28px; letter-spacing: .08em; margin-bottom: 18px; }
#loader .bar { height: 8px; border-radius: 4px; background: #2a2d33; overflow: hidden; }
#loader .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #d8a840, #f2d27a); transition: width .25s; }
#loader .status { margin-top: 12px; color: #c8c4b8; }
#loader .hint { margin-top: 18px; font-size: 13px; color: #8a8a86; }
</style>
